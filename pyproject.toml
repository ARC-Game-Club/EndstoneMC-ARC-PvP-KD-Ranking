[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone_arc_hunter"
version = "0.1.3"
dependencies = []
authors = [
    { name = "DEVILENMO", email = "DEVILENMO@gmail.com" },
]
description = "ARC Hunter Ranking - PvP KD tracker and title ranks for EndStone"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "plugin"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/ARC-Minecraft/EndstoneMC-ARC-Hunter-Ranking"

[project.entry-points."endstone"]
arc_hunter = "endstone_arc_hunter:ARCHunterPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_arc_hunter"]
