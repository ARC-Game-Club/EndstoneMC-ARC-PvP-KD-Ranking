[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone_arc_pvp_kd"
version = "0.2.5"
dependencies = []
authors = [
    { name = "DEVILENMO", email = "DEVILENMO@gmail.com" },
]
description = "弧光 PvP KD 排行榜插件 - EndStone PvP KD tracker and title ranks"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "plugin", "pvp", "kd", "ranking", "arc"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/ARC-Minecraft/EndstoneMC-ARC-PvP-KD-Ranking"

[project.entry-points."endstone"]
arc_pvp_kd = "endstone_arc_pvp_kd:ARCPvPKDPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_arc_pvp_kd"]
